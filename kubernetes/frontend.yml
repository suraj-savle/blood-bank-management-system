
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blood-bank-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blood-bank-frontend
  template:
    metadata:
      labels:
        app: blood-bank-frontend
    spec:
      containers:
        - name: frontend
          image: blood-bank-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: blood-bank-frontend
spec:
  type: NodePort
  selector:
    app: blood-bank-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
